[tool.poetry]
name = "todo-ai-backend"
version = "1.0.0"
description = "AI-powered Todo Management Backend with MCP Tools"
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.104.1"
uvicorn = {extras = ["standard"], version = "0.24.0"}
sqlmodel = "0.0.14"
pydantic = "2.5.0"
pydantic-settings = "2.1.0"
passlib = {extras = ["bcrypt"], version = "1.7.4"}
python-jose = {extras = ["cryptography"], version = "3.3.0"}
python-multipart = "^0.0.6"
alembic = "1.13.1"
psycopg2-binary = "2.9.9"
python-dotenv = "1.0.0"
gunicorn = "21.2.0"
openai = "^1.0.0"
tiktoken = "^0.5.0"
mcp-sdk = "^1.0.0"
mcp = "1.0.0"
openai-agents = "^0.1.0"
betterproto = "2.0.0b6"
uvloop = "^0.19.0"
httptools = "^0.6.0"
jinja2 = "^3.1.0"
itsdangerous = "^2.1.0"
python-dateutil = "^2.8.0"
cryptography = "^41.0.0"
bcrypt = "^4.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.uvicorn]
host = "0.0.0.0"
port = 7860
log-level = "info"
reload = false
workers = 1

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"