[tool.poetry]
name = "todo-backend"
version = "1.0.0"
description = "Production-ready Todo Web Application Backend"
authors = ["AI Developer <ai@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
sqlmodel = "^0.0.16"
uvicorn = "^0.24.0"
python-jose = "^3.3.0"
passlib = "^1.7.4"
bcrypt = "^4.0.1"
python-multipart = "^0.0.6"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
better-exceptions = "^0.3.3"
gunicorn = "^21.2.0"
redis = "^5.0.1"
python-dotenv = "^1.0.0"
httpx = "^0.25.2"
celery = "^5.3.4"
flower = "^2.0.0"
structlog = "^23.2.0"
prometheus-client = "^0.19.0"
circuitbreaker = "^1.4.0"
limits = "^3.10.0"
slowapi = "^0.1.9"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
black = "^23.11.0"
flake8 = "^6.1.0"
mypy = "^1.7.1"
isort = "^5.12.0"
pre-commit = "^3.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
skip-string-normalization = true

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"